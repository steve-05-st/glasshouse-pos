const modals = [];
function openModal(html, opts) {
  opts = opts || {};
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet ${opts.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.label || 'Dialog')}">${html}</div>`;
  $('#modals').appendChild(scrim);
  const m = {
    el: scrim,
    sheet: scrim.firstElementChild,
    opts,
    close(silent) {
      const i = modals.indexOf(m);
      if (i < 0) return;
      modals.splice(i, 1);
      scrim.remove();
      if (!silent && opts.onClose) opts.onClose();
    },
  };
  scrim.addEventListener('mousedown', (e) => {
    if (e.target === scrim && !opts.sticky) m.close();
  });
  modals.push(m);
  setTimeout(() => {
    const f = m.sheet.querySelector('[autofocus]') || m.sheet.querySelector('input:not([type=hidden]):not([type=file]),textarea');
    if (f && f.focus) f.focus();
    else {
      m.sheet.tabIndex = -1; // keeps keyboard shortcuts (cash keypad, Enter, Esc) working inside the dialog
      m.sheet.focus({ preventScroll: true });
    }
  }, 40);
  return m;
}
const topModal = () => modals[modals.length - 1];
function closeTop() {
  const m = topModal();
  if (m) m.close();
}
function confirmBox(o) {
  return new Promise((resolve) => {
    let done = false;
    const m = openModal(
      `<div class="sheet-h"><h3>${esc(o.title)}</h3></div><div class="sheet-b"><div>${o.body || ''}</div></div>
       <div class="sheet-f"><button class="btn" data-act="cfNo">${esc(o.cancel || 'Cancel')}</button><button class="btn ${o.danger ? 'danger solid' : 'primary'}" data-act="cfYes">${esc(o.ok || 'Confirm')}</button></div>`,
      {
        label: o.title,
        onClose: () => {
          if (!done) {
            done = true;
            resolve(false);
          }
        },
      }
    );
    m.yes = () => {
      done = true;
      m.close(true);
      resolve(true);
    };
  });
}
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'bad' ? 6000 : 3200);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied');
    return;
  } catch (e) {
    /* fall through */
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? 'Copied' : 'Copy is not available here', ok ? '' : 'bad');
  } catch (e) {
    toast('Copy is not available here', 'bad');
  }
}
/* Saves a generated file: through the page's downloads capability when hosted, otherwise a normal browser download. */
async function saveFile(filename, data, mime) {
  const hosted = typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function';
  if (hosted) {
    // Inside the published page a plain <a download> is blocked, so the downloads capability is the only way out.
    if (Remote.dlReady) await Remote.dlReady;
    if (!Remote.dl) return 'failed';
    try {
      await Remote.dl.save({ filename, data });
      return 'saved';
    } catch (e) {
      if (e && e.code === 'declined') return 'declined';
      if (e && e.code === 'rate_limited') return 'busy';
      return 'failed';
    }
  }
  try {
    const blob = new Blob([data], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 3000);
    return 'started';
  } catch (e) {
    return 'failed';
  }
}

/* ---------- payment ---------- */
let PAY = null;
const roundUp = (n, step) => Math.ceil(n / step) * step;
function quickAmounts(total) {
  const out = [total];
  [500, 1000, 5000, 10000, 20000].forEach((s) => {
    const v = roundUp(total, s);
    if (v > total && out.indexOf(v) < 0) out.push(v);
  });
  return out.slice(0, 5);
}
function openPay() {
  if (!st.cart.items.length) return;
  const t = totals();
  const pays = st.settings.pays.length ? st.settings.pays : ['Cash'];
  // Always start on the first method (Cash): a remembered mobile-pay choice is easy to miss and would record a cash sale as KBZPay.
  PAY = { method: pays[0], tend: '', total: t.total, pays, modal: null };
  PAY.modal = openModal('', { label: 'Payment', onClose: () => (PAY = null) });
  drawPay();
}
function drawPay() {
  if (!PAY) return;
  const p = PAY;
  const tend = +p.tend || 0;
  const cash = p.method === 'Cash';
  const short = cash && tend < p.total;
  let body = '';
  if (cash) {
    const q = quickAmounts(p.total);
    body = `
      <div class="cash-row"><span class="lbl">Cash received</span><b>${fmtNum(tend)} Ks</b></div>
      <div class="quick">${q.map((v, i) => `<button class="btn sm" data-act="payQuick" data-v="${v}">${i === 0 ? 'Exact' : fmtNum(v)}</button>`).join('')}<button class="btn sm ghost" data-act="payKey" data-k="C">Clear</button></div>
      <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', '⌫'].map((k) => `<button type="button" data-act="payKey" data-k="${k}" aria-label="${k === '⌫' ? 'Backspace' : k}">${k}</button>`).join('')}</div>
      <div class="change ${tend >= p.total && tend > 0 ? 'ok' : tend > 0 ? 'short' : ''}">${tend === 0 ? 'Enter the cash received' : tend >= p.total ? 'Change to give: ' + ks(tend - p.total) : 'Still to pay: ' + ks(p.total - tend)}</div>`;
  } else {
    body = `<div class="hint">Complete the order once the ${esc(p.method)} payment has arrived.</div>`;
  }
  p.modal.sheet.innerHTML = `
    <div class="sheet-h"><h3>Payment</h3><button class="icon-btn" data-act="modalClose" aria-label="Close">${ico('x')}</button></div>
    <div class="sheet-b">
      <div class="pay-total"><span>Total to pay</span><b>${fmtNum(p.total)} Ks</b></div>
      <div class="methods" role="group" aria-label="Payment method">${p.pays.map((x) => `<button type="button" class="${x === p.method ? 'on' : ''}" data-act="payMethod" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      ${body}

function payKey(k) {
  if (!PAY) return;
  let t = PAY.tend;
  if (k === 'C') t = '';
  else if (k === '⌫') t = t.slice(0, -1);
  else if (t.length + k.length <= 9) t = (t + k).replace(/^0+(?=\d)/, '');
  PAY.tend = t;

}
function payDone() {
  if (!PAY || !st.cart.items.length) return;

/* ======================================================================
   Excel import: reads an .xlsx in the browser (ZIP + XML, no libraries)
   and turns rows of earlier orders into app orders.
   Expected columns on the first sheet that has them (any order, any case):
   order_id, date, time, item, qty, price, payment
   ====================================================================== */

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser is too old to read Excel files. Please use an up to date Chrome or Safari.');
  const ds = new DecompressionStream('deflate-raw');
  const out = new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return new Uint8Array(await out.arrayBuffer());
}
async function unzip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) {
      e = i;
      break;
    }
  }
  if (e < 0) throw new Error('This file is not an Excel (.xlsx) file.');
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  const dec = new TextDecoder();
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true);
    const xlen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (!/^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/[^/]+\.xml)$/.test(name)) continue;
    const ln = dv.getUint16(lho + 26, true);
    const lx = dv.getUint16(lho + 28, true);
    const data = u8.subarray(lho + 30 + ln + lx, lho + 30 + ln + lx + csize);
    files[name] = dec.decode(method === 0 ? data : await inflateRaw(data));
  }
  return files;
}
const xmlDoc = (t) => new DOMParser().parseFromString(t, 'application/xml');
const colNum = (ref) => {
  const m = /^([A-Z]+)/.exec(ref);
  let n = 0;
  for (const ch of m ? m[1] : 'A') n = n * 26 + ch.charCodeAt(0) - 64;
  return n - 1;
};
async function readXlsx(file) {
  const files = await unzip(await file.arrayBuffer());
  if (!files['xl/workbook.xml']) throw new Error('This file is not an Excel (.xlsx) file.');
  const shared = [];
  if (files['xl/sharedStrings.xml']) {
    xmlDoc(files['xl/sharedStrings.xml']).querySelectorAll('si').forEach((si) => shared.push(Array.from(si.querySelectorAll('t')).map((t) => t.textContent).join('')));
  }
  const rels = {};
  xmlDoc(files['xl/_rels/workbook.xml.rels'] || '<r/>').querySelectorAll('Relationship').forEach((r) => (rels[r.getAttribute('Id')] = r.getAttribute('Target')));
  const out = [];
  xmlDoc(files['xl/workbook.xml']).querySelectorAll('sheet').forEach((sh) => {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = rels[rid] || '';
    target = 'xl/' + target.replace(/^\/?(xl\/)?/, '');
    const xml = files[target];
    if (!xml) return;
    const rows = [];
    xmlDoc(xml).querySelectorAll('sheetData > row').forEach((row) => {
      const r = [];
      row.querySelectorAll('c').forEach((c) => {
        const t = c.getAttribute('t');
        const v = c.querySelector('v');
        let val = null;
        if (t === 'inlineStr') val = Array.from(c.querySelectorAll('t')).map((x) => x.textContent).join('');
        else if (v) val = t === 's' ? shared[+v.textContent] : t === 'str' || t === 'e' ? v.textContent : t === 'b' ? v.textContent === '1' : parseFloat(v.textContent);
        r[colNum(c.getAttribute('r') || 'A1')] = val;
      });
      rows.push(r);
    });
    out.push({ name: sh.getAttribute('name'), rows });
  });
  return out;
}
const serialToDay = (n) => {
  const d = new Date(Math.round((n - 25569) * 86400000));
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
};
function parseDay(v) {
  if (typeof v === 'number' && v > 20000 && v < 90000) return serialToDay(v);
  const s = String(v == null ? '' : v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/.exec(s);
  if (m) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
  return '';
}
function parseTod(v) {
  if (typeof v === 'number' && v >= 0 && v < 1) return Math.round(v * 86400);
  const m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?$/.exec(String(v == null ? '' : v).trim());
  if (!m) return -1;
  let h = +m[1];
  if (m[4]) h = (h % 12) + (/p/i.test(m[4]) ? 12 : 0);
  if (h > 23 || +m[2] > 59) return -1;
  return h * 3600 + +m[2] * 60 + (m[3] ? +m[3] : 0);
}
const HEADS = { order_id: ['order_id', 'order id', 'order', 'orderid', 'id'], date: ['date'], time: ['time'], item: ['item', 'name', 'product'], qty: ['qty', 'quantity'], price: ['price', 'unit price', 'unit_price'], payment: ['payment', 'pay', 'method'] };
/* Builds app orders from the sheets of a workbook. Returns { orders, stats }. */
function ordersFromSheets(sheets) {
  const stats = { rows: 0, skipped: 0, noTime: 0, offMenu: new Map(), sheet: '' };
  let found = null;
  for (const sh of sheets) {
    for (let i = 0; i < Math.min(5, sh.rows.length); i++) {
      const hdr = (sh.rows[i] || []).map((c) => String(c == null ? '' : c).trim().toLowerCase());
      const idx = {};
      Object.keys(HEADS).forEach((k) => (idx[k] = hdr.findIndex((h) => HEADS[k].indexOf(h) >= 0)));
      if (idx.date >= 0 && idx.item >= 0 && idx.qty >= 0 && idx.price >= 0) {
        found = { sh, idx, at: i };
        break;
      }
    }
    if (found) break;
  }
  if (!found) throw new Error('Could not find the columns. The first row needs: order_id, date, time, item, qty, price, payment.');
  stats.sheet = found.sh.name;
  const { idx } = found;
  const menuByName = new Map(st.menu.map((m) => [m.name.trim().toLowerCase(), m]));
  const groups = new Map();
  found.sh.rows.slice(found.at + 1).forEach((r) => {
    if (!r || r.every((c) => c == null || c === '')) return;
    stats.rows += 1;
    const day = parseDay(r[idx.date]);
    const name = String(r[idx.item] == null ? '' : r[idx.item]).trim();
    const qty = Math.round(Number(r[idx.qty]));
    const price = Math.round(Number(r[idx.price]));
    if (!day || !name || !(qty > 0) || !(price >= 0)) {
      stats.skipped += 1;
      return;
    }
    const oid = idx.order_id >= 0 && r[idx.order_id] != null && r[idx.order_id] !== '' ? String(r[idx.order_id]).trim() : '';
    if (!oid) {
      stats.skipped += 1;
      return;
    }
    const key = day + '|' + oid;
    let g = groups.get(key);
    if (!g) groups.set(key, (g = { oid, day, tod: -1, pay: '', rows: [] }));
    if (idx.time >= 0 && g.tod < 0) g.tod = parseTod(r[idx.time]);
    const pay = idx.payment >= 0 && r[idx.payment] != null ? String(r[idx.payment]).trim() : '';
    if (pay && !g.pay) g.pay = pay;
    g.rows.push({ name, qty, price });
  });
  const payName = (p) => {
    const l = p.toLowerCase();
    if (!l) return 'Not recorded';
    if (l === 'cash') return 'Cash';
    if (l === 'qr') return 'QR';
    const hit = st.settings.pays.find((x) => x.toLowerCase() === l);
    return hit || p.charAt(0).toUpperCase() + p.slice(1);
  };
  const orders = [];
  groups.forEach((g) => {
    const items = g.rows.map((x) => {
      const m = menuByName.get(x.name.toLowerCase());
      if (!m) stats.offMenu.set(x.name, (stats.offMenu.get(x.name) || 0) + 1);
      return { name: x.name, cat: m ? m.cat : 'Other', price: x.price, qty: x.qty, note: '' };
    });
    const sub = items.reduce((a, i) => a + i.price * i.qty, 0);
    const p = g.day.split('-').map(Number);
    const secs = g.tod >= 0 ? g.tod : 12 * 3600;
    const ts = new Date(p[0], p[1] - 1, p[2], Math.floor(secs / 3600), Math.floor((secs % 3600) / 60)).getTime();
    if (g.tod < 0) stats.noTime += 1;
    const tail = /(\d+)\s*$/.exec(g.oid);
    const o = cleanOrder(
      { id: g.oid.replace(/[^\w-]+/g, '') + '-imp', no: tail ? +tail[1] : 0, day: g.day, ts, tod: g.tod, type: 'dine', items, sub, total: sub, pay: payName(g.pay), note: g.tod < 0 ? 'Imported: time not recorded' : 'Imported' },
      null
    );
    if (o) orders.push(o);
  });
  orders.sort((a, b) => a.day.localeCompare(b.day) || a.no - b.no);
  return { orders, stats };
}

/* ---------- charts (plain HTML, hover + keyboard tooltips, table twin) ---------- */
function niceStep(max, ticks) {
  const raw = max / ticks || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
}
const fmtAxis = (v) => (v >= 1e6 ? v / 1e6 + 'M' : v >= 10000 ? v / 1000 + 'K' : fmtNum(v));
function barChart(o) {
  const max = Math.max.apply(null, o.items.map((i) => i.value).concat([1]));
  const step = Math.max(1, niceStep(max, 4));
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);
  const peak = o.items.findIndex((i) => i.value === max);
  const yl = ticks.map((v) => `<span style="bottom:${(v / top) * 100}%">${fmtAxis(v)}</span>`).join('');
  const gl = ticks.slice(1).map((v) => `<i class="gl" style="bottom:${(v / top) * 100}%"></i>`).join('');
  const bars = o.items
    .map(
      (i, idx) =>
        `<div class="slot" tabindex="0" data-tipv="${esc(i.tipVal)}" data-tipl="${esc(i.tipLabel)}" aria-label="${esc(i.tipLabel + ': ' + i.tipVal)}"><div class="bar" style="height:${(i.value / top) * 100}%">${idx === peak && i.value > 0 ? `<span class="peak">${esc(i.peak || String(i.value))}</span>` : ''}</div></div>`
    )
    .join('');
  const xl = o.items.map((i) => `<span>${esc(i.label)}</span>`).join('');
  return `<div class="chart" role="group" aria-label="${esc(o.aria)}"><div class="ylab">${yl}</div><div class="plot">${gl}<div class="bars">${bars}</div></div><div class="xlab">${xl}</div></div>`;
}
const tipEl = () => $('#tip');
function showTip(slot) {
  const t = tipEl();
  t.textContent = '';
  const s = document.createElement('strong');
  s.textContent = slot.dataset.tipv;
  t.appendChild(s);
  t.appendChild(document.createTextNode(slot.dataset.tipl));
  t.hidden = false;
  const bar = slot.querySelector('.bar');
  const r = (bar && bar.offsetHeight > 0 ? bar : slot).getBoundingClientRect();
  const tr = t.getBoundingClientRect();
  let x = r.left + r.width / 2 - tr.width / 2;
  x = Math.max(8, Math.min(x, window.innerWidth - tr.width - 8));
  let y = r.top - tr.height - 10;
  if (y < 8) y = r.bottom + 10;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}

  const from = rg[0];
  const to = rg[1];

  let h = `<div class="page-head"><h2>Report</h2><div class="actions"><button class="btn primary" data-act="exportReport" ${s.orders + s.voided ? '' : 'disabled'}>${ico('down')} Download Excel</button></div></div>

  if (!s.orders) {
    h += `<div class="card empty">No paid orders in this range.</div>`;

  /* orders by hour */

      lo = Math.min(lo, i);
      hi = Math.max(hi, i);

  const hours = [];
  let busiest = lo;

  /* revenue by day */
  if (multi) {
    const dayRows = Array.from(s.byDay.keys()).sort();
    if (span <= 62) {

      for (let i = 0; i < span; i++) {
        const k = addDays(from, i);
        const d = s.byDay.get(k) || { n: 0, rev: 0 };
        items.push({ label: span > 31 ? (+k.slice(8) % 5 === 1 ? String(+k.slice(8)) : '') : String(+k.slice(8)), value: d.rev, peak: fmtAxis(d.rev), tipVal: ks(d.rev), tipLabel: fmtDay(k) + ' · ' + d.n + (d.n === 1 ? ' order' : ' orders') });
      }
      h += `<div class="card"><h3>Revenue by day</h3>${barChart({ items, aria: 'Revenue per day' })}<p class="chart-cap">Day of the month. Revenue in Myanmar Kyat.</p>`;
    } else h += `<div class="card"><h3>Revenue by day</h3>`;
    h += `<details class="tv"${span > 62 ? ' open' : ''}><summary>Table view</summary><div class="tbl-wrap"><table class="t"><thead><tr><th>Date</th><th class="r">Orders</th><th class="r">Items</th><th class="r">Revenue</th></tr></thead><tbody>${dayRows.map((k) => `<tr><td>${esc(fmtDay(k))}</td><td class="r">${s.byDay.get(k).n}</td><td class="r">${s.byDay.get(k).items}</td><td class="r">${ks(s.byDay.get(k).rev)}</td></tr>`).join('')}</tbody></table></div></details></div>`;
  }

  /* payments and categories */
  const pays = Array.from(s.byPay.entries()).sort((a, b) => b[1].rev - a[1].rev);
  const cats = Array.from(s.byCat.entries()).sort((a, b) => b[1].rev - a[1].rev);

  /* top items */
  const items = Array.from(s.byItem.values()).sort((a, b) => b.qty - a.qty || b.rev - a.rev).slice(0, 10);
  const mx = items[0] ? items[0].qty : 1;
  h += `<div class="card"><h3>Top items</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Item</th><th class="r">Sold</th><th class="r">Sales</th></tr></thead><tbody>${items
    .map((i) => `<tr><td><b>${esc(i.name)}</b> <span class="muted">${esc(i.cat)}</span><div class="meter"><i style="width:${(i.qty / mx) * 100}%"></i></div></td><td class="r">${i.qty}</td><td class="r">${ks(i.rev)}</td></tr>`)
    .join('')}</tbody></table></div><p class="hint">Item sales are before order discounts and tax. The Excel file lists every item.</p></div>`;
  $('#p-report').innerHTML = h;
}

function parsePrice(s) {
  if (s == null) return NaN;
  const t = String(s).replace(/[,\s]/g, '').replace(/(ks|mmk|kyat|k|ကျပ်)$/i, '');
  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  const n = parseFloat(t);
  return n >= 0 && n < 1e8 ? Math.round(n) : NaN;
}
function parseMenuText(text) {
  const items = [];
  let cat = '';
  let skipped = 0;
  const re = new RegExp('^(.*?)[\\s,:;\\-\\u2013\\u2014]*((?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d+)?)\\s*(?:ks|mmk|kyat|k|\\u1000\\u103B\\u1015\\u103A)?\\s*(?:[,;]\\s*(.+))?$', 'i');
  String(text || '')
    .split(/\r?\n/)
    .forEach((raw) => {
      const line = raw
        .replace(/^﻿/, '')
        .replace(/["“”]/g, '')
        .replace(/[၀-၉]/g, (d) => String(d.charCodeAt(0) - 0x1040)) // Burmese digits to 0-9
        .trim();
      if (!line) return;
      if (/price/i.test(line) && !/\d/.test(line)) return; // a header row such as "Name, Price, Category"
      let name = '';
      let price = NaN;
      let c = '';
      if (/\t|\|/.test(line)) {
        // Spreadsheet columns in any order: the last number is the price, the text next to it is the name, the other text is the category.
        const cells = line.split(/\t|\|/).map((x) => x.trim()).filter(Boolean);
        let pi = -1;
        for (let i = cells.length - 1; i >= 0; i--) {
          if (Number.isFinite(parsePrice(cells[i]))) {
            pi = i;
            break;
          }
        }
        if (pi >= 0) {
          price = parsePrice(cells[pi]);
          const before = cells.slice(0, pi).filter((x) => !Number.isFinite(parsePrice(x)));
          const after = cells.slice(pi + 1).filter((x) => !Number.isFinite(parsePrice(x)));
          name = before.length ? before[before.length - 1] : after.shift() || '';
          c = after[0] || (before.length > 1 ? before[before.length - 2] : '');
        }
      } else {
        const m = line.match(re);
        if (m) {
          name = m[1].trim();
          price = parsePrice(m[2]);
          c = (m[3] || '').trim();
        }
      }
      if (name && Number.isFinite(price)) items.push({ name: name.slice(0, 80), price, cat: (c || cat || 'Other').slice(0, 40) });
      else if (!/\d/.test(line)) cat = line.replace(/^[#\[\]\-–—*\s]+|[:\]\s]+$/g, '').slice(0, 40) || cat;
      else skipped += 1;
    });
  return { items, skipped };
}

async function doExport(from, to) {

    return false;
  }
  let bytes;
  try {
    bytes = await XlsxLite.buildWorkbook(list, { pays: st.settings.pays, cafe: st.settings.cafe, generated: dayKey() });
  } catch (e) {
    toast('Could not build the Excel file: ' + (e && e.message ? e.message : e), 'bad');
    return false;
  }
  const slug = (st.settings.cafe || 'cafe').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cafe';
  const name = slug + '-orders_' + (from === to ? from : from + '_to_' + to) + '.xlsx';
  const r = await saveFile(name, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  if (r === 'saved' || r === 'started') {
    st.meta.lastExport = Date.now();
    Local.kvSet('meta', st.meta);

async function restoreFrom(f) {
  if (!f) return;
  let data;
  try {
    data = JSON.parse(await f.text());
  } catch (e) {
    toast('That file is not a valid backup', 'bad');
    return;
  }
  if (!data || data.app !== 'cafepos' || !Array.isArray(data.orders)) {
    toast('That is not a Cafe POS backup file', 'bad');
    return;
  }
  const orders = data.orders.map((o) => cleanOrder(o, o && o.id)).filter(Boolean);
  const hasMenu = Array.isArray(data.menu);
  const ok = await confirmBox({
    title: 'Restore this backup?',
    body: `It adds <b>${orders.length}</b> orders${hasMenu ? ', replaces your menu with <b>' + data.menu.length + '</b> items' : ''} and replaces your settings. Orders you already have are kept.`,
    ok: 'Restore',
  });
  if (!ok) return;
  const fresh = [];
  orders.forEach((o) => {
    const cur = st.orders.get(o.id);
    if (!cur || cmpRev(o, cur) > 0) {
      o._dirty = true;
      o._doc = cur ? cur._doc : '';
      putOrder(o);
      fresh.push(o);
    }
  });
  if (hasMenu) {
    st.menu = data.menu.map(cleanItem).filter(Boolean);
    commitMenu();
  }
  if (data.settings) {
    st.settings = cleanSettings(data.settings);
    st.settingsUpd = Date.now();
    Local.kvSet('settings', Object.assign({ upd: st.settingsUpd }, st.settings));
    Remote.pushSettings();
  }
  await Local.putOrders(fresh);
  Remote.flush();
  scheduleRender();

}

function wire() {

      e.preventDefault();
      fn(t, e);
    }
  });
  document.addEventListener('input', (e) => {

    if (t && INPUT[t.dataset.in]) INPUT[t.dataset.in](t, e);
  });
  document.addEventListener('change', (e) => {
    const t = e.target.closest('[data-ch]');
    if (t && CHANGE[t.dataset.ch]) CHANGE[t.dataset.ch](t, e);
  });

    if (e.key === 'Escape' && modals.length) {
      closeTop();

    }

        payKey(e.key);
        e.preventDefault();
      } else if (PAY.method === 'Cash' && e.key === 'Backspace') {
        payKey('⌫');
        e.preventDefault();
      } else if (e.key === 'Enter') {
        payDone();
        e.preventDefault();
      }
    }
  });
  document.addEventListener('pointerover', (e) => {
    const s = e.target.closest && e.target.closest('.slot');
    if (s) showTip(s);
  });
  document.addEventListener('pointerout', (e) => {
    const s = e.target.closest && e.target.closest('.slot');
    if (s && !s.contains(e.relatedTarget)) hideTip();
  });
  document.addEventListener('focusin', (e) => {
    const s = e.target.closest && e.target.closest('.slot');
    if (s) showTip(s);
  });
  document.addEventListener('focusout', (e) => {
    const s = e.target.closest && e.target.closest('.slot');
    if (s) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);
  document.addEventListener('pointerdown', (e) => {
    if (!(e.target.closest && e.target.closest('.slot'))) hideTip(); // touch screens never send "pointer out", so a tap elsewhere closes the tooltip
  });
}

/* ---------- boot ---------- */
let lastDay = dayKey();
function tick() {
  const d = dayKey();
  if (d !== lastDay) {
    if (st.ui.ordersDay === lastDay) st.ui.ordersDay = d;
    lastDay = d;
  }
  renderTop();
  if (st.ui.view === 'sell') {
    $('#cartNo').textContent = '#' + pad(nextNo(), 3);
    $('#cartClock').textContent = fmtDay(dayKey()) + ' · ' + fmtTod(todOfTs(Date.now()));
  }
}
async function boot() {
  st.role = window.POS_AUTH && window.POS_AUTH.role === 'staff' ? 'staff' : 'owner';
  shell();
  wire();
  await Local.open();
  const got = await Promise.all([Local.kvGet('menu'), Local.kvGet('settings'), Local.kvGet('cart'), Local.kvGet('meta'), Local.allOrders()]);
  const menu = got[0];
  const settings = got[1];
  const cart = got[2];
  const meta = got[3];
  if (menu && Array.isArray(menu.items)) {
    st.menu = menu.items.map(cleanItem).filter(Boolean);
    st.menuUpd = num(menu.upd);
  }
  if (settings && typeof settings === 'object') {
    st.settings = cleanSettings(settings);
    st.settingsUpd = num(settings.upd);
  }
  if (cart && Array.isArray(cart.items)) {
    st.cart = newCart();
    st.cart.items = cart.items.map((i) => ({ id: str(i && i.id, 40), name: str(i && i.name, 80), cat: str(i && i.cat, 40), price: Math.max(0, Math.round(num(i && i.price))), qty: Math.max(0, Math.round(num(i && i.qty))), note: str(i && i.note, 120) })).filter((i) => i.id && i.name && i.qty > 0);
    st.cart.type = cart.type === 'take' ? 'take' : 'dine';
    st.cart.table = str(cart.table, 60);
    st.cart.note = str(cart.note, 200);
    if (cart.disc && typeof cart.disc === 'object') st.cart.disc = { mode: cart.disc.mode === 'pct' ? 'pct' : 'amt', val: Math.max(0, num(cart.disc.val)) };
    st.ui.discOpen = st.cart.disc.val > 0;
  }
  if (meta && typeof meta === 'object') Object.assign(st.meta, { lastExport: num(meta.lastExport), lastPay: str(meta.lastPay, 30), sampleDismissed: !!meta.sampleDismissed });
  (got[4] || []).forEach((r) => {
    const o = cleanOrder(r, r && r.id);
    if (!o) return;
    o._doc = str(r._doc, 40);
    o._dirty = !!r._dirty;
    putOrder(o);
  });
  go('sell');
  renderTop();
  renderSync();
  Remote.init();
  setInterval(tick, 20000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      tick();
      Remote.retry();
    }
  });
  window.addEventListener('online', () => Remote.retry());
  if (/[?&]debug\b/.test(location.search)) window.__POS = { st, Remote, Local, completeOrder, voidOrder, parseMenuText, summarize, XlsxLite, putOrder, cleanOrder, scheduleRender, dayKey, go };
}
window.__posStart = boot;
if (window.POS_NOGATE || window.__posGo) boot();

})();
</script>
